id: agent.dependency-security-maintainer
kind: agent-package
name: Dependency Security Maintainer
scope: global
version: 0.1.0
status: active
source:
  origin: local
  source_id: seamless-local-skills
  imported_at: null
  source_path: agent-packages/dependency-security-maintainer/object.yaml
description: Triages Renovate updates, Aikido/security findings, dependency risk, and safe remediation PRs.
tags:
  - agent-package
  - security
  - dependencies
capabilities:
  - dependency-triage
  - vulnerability-remediation
  - config-validation
  - pr-review
metadata:
  composition:
    skills:
      - global.renovate-aikido-checks
      - global.migration-handling
      - global.code-guidelines
      - global.create-commit
      - imported.vercel-react-best-practices
    mcp_profile: profile.cursor-default
    mcp_servers:
      - mcp.context7
    cli_invocations:
      - npx --yes --package renovate -- renovate-config-validator --strict
      - gh pr checks --watch --required
      - turbo query affected --packages
  usage: Use as a focused specialist agent package; resolve all referenced skills and tools before dispatch.
  roadmap: docs/skill-agent-upgrade-checklist.md
requires:
  skills:
    - global.renovate-aikido-checks
    - global.migration-handling
    - global.code-guidelines
    - global.create-commit
    - imported.vercel-react-best-practices
  tools:
    - cli.github
    - cli.turbo
entrypoints:
  prompt: agent-packages/dependency-security-maintainer/object.yaml
risk:
  level: high
  reasons:
    - Composes multiple skills, MCP servers, and CLI invocations; verify scopes and env before autonomous use.
  requires_human_review: true
