id: agent.frontend-experience-builder
kind: agent-package
name: Frontend Experience Builder
scope: global
version: 0.1.0
status: active
source:
  origin: local
  source_id: seamless-local-skills
  imported_at: null
  source_path: agent-packages/frontend-experience-builder/object.yaml
description: Builds and reviews high-quality frontend experiences from design through implementation, accessibility, and E2E validation.
tags:
  - agent-package
  - frontend
  - ui
  - accessibility
capabilities:
  - frontend-planning
  - pixel-perfect-implementation
  - ui-review
  - e2e-validation
metadata:
