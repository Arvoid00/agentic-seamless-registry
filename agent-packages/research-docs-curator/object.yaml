  imported_at: null
  source_path: agent-packages/research-docs-curator/object.yaml
description: Runs source-grounded research, synthesizes findings, and updates docs/checklists without over-searching or prompt drift.
tags:
  - agent-package
  - research
  - docs
capabilities:
