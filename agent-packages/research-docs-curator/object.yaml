  - source-synthesis
  - docs-drift
  - checklist-authoring
metadata:
  composition:
    skills:
      - global.research-prompts
      - global.documentation-updates-drift
      - global.code-guidelines
      - global.copy-writer
    mcp_profile: profile.cursor-default
    mcp_servers:
      - mcp.context7
    cli_invocations:
      - gh repo view <repo>
      - gh issue list
      - gh pr list
  usage: Use as a focused specialist agent package; resolve all referenced skills and tools before dispatch.
  roadmap: docs/skill-agent-upgrade-checklist.md
requires:
  skills:
    - global.research-prompts
    - global.documentation-updates-drift
    - global.code-guidelines
    - global.copy-writer
  tools:
    - cli.github
entrypoints:
  prompt: agent-packages/research-docs-curator/AGENT.md
